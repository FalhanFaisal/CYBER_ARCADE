<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER ARCADE PC - 9 Retro Games in One Portal</title>
    <meta name="description" content="Ultimate PC Desktop Gaming Arcade Portal featuring 9 retro and cyberpunk mini games with keyboard & mouse controls, audio synthesis, and high scores.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Arcade Header -->
    <header class="arcade-header">
        <div class="brand-logo">
            <svg class="header-logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f3ff" />
                        <stop offset="50%" stop-color="#bf00ff" />
                        <stop offset="100%" stop-color="#ff007f" />
                    </linearGradient>
                    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <!-- Shield Contour -->
                <polygon points="50,5 90,25 90,65 50,95 10,65 10,25" fill="rgba(10, 13, 28, 0.9)" stroke="url(#logo-grad)" stroke-width="4" filter="url(#logo-glow)" />
                <!-- Inner Hex Pattern / Accent -->
                <polygon points="50,15 80,30 80,60 50,83 20,60 20,30" fill="none" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1.5" stroke-dasharray="4 2" />
                <!-- Cyber Gamepad Icon -->
                <path d="M30 46 C30 38, 38 36, 44 42 L50 48 L56 42 C62 36, 70 38, 70 46 C70 56, 64 66, 58 66 C55 66, 53 62, 50 62 C47 62, 45 66, 42 66 C36 66, 30 56, 30 46 Z" fill="url(#logo-grad)" />
                <!-- D-Pad -->
                <path d="M37 44 H41 M39 42 V46" stroke="#070913" stroke-width="2.5" stroke-linecap="round" />
                <!-- Buttons -->
                <circle cx="60" cy="44" r="1.5" fill="#ffe600" />
                <circle cx="64" cy="48" r="1.5" fill="#39ff14" />
                <circle cx="56" cy="48" r="1.5" fill="#ff007f" />
                <circle cx="60" cy="52" r="1.5" fill="#00f3ff" />
                <!-- Lightning Center Bolt -->
                <polygon points="51,24 45,35 49,35 47,43 55,31 51,31" fill="#ffe600" />
            </svg>
            <span class="brand-name">CYBER ARCADE</span>
            <span class="brand-badge">PC EDITION</span>
        </div>
        <div class="header-controls">
            <button class="icon-btn" id="btn-toggle-audio">🔊 AUDIO: ON</button>
            <button class="icon-btn" id="btn-toggle-fs">🖥️ FULLSCREEN [F]</button>
        </div>
    </header>

    <!-- Lobby Content -->
    <main class="lobby-container">
        <section class="hero-section">
            <h1 class="hero-title">ULTIMATE PC GAMING SUITE</h1>
            <p class="hero-subtitle">
                <span>Press <kbd>ESC</kbd> anytime to return to Lobby</span>
                <span>•</span>
                <span>Press <kbd>M</kbd> Mute Audio</span>
                <span>•</span>
                <span>Press <kbd>F</kbd> Fullscreen</span>
            </p>
        </section>

        <!-- Game Selector Grid -->
        <section class="game-grid" id="arcade-game-grid"></section>
    </main>

    <!-- Active Game Viewport Overlay -->
    <div class="game-viewport-overlay hidden" id="game-viewport-overlay">
        <div class="game-top-bar">
            <h2 class="active-game-title" id="active-game-title">GAME TITLE</h2>
            <div class="header-controls">
                <button class="icon-btn" id="btn-exit-game">🔙 BACK TO LOBBY [ESC]</button>
            </div>
        </div>
        <div class="game-stage" id="game-stage"></div>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/games/neon-memory.js"></script>
    <script src="js/games/tictactoe.js"></script>
    <script src="js/games/brick-smash.js"></script>
    <script src="js/games/cyber-racer.js"></script>
    <script src="js/games/cyber-invaders.js"></script>
    <script src="js/games/cyber-pong.js"></script>
    <script src="js/games/retro-aero.js"></script>
    <script src="js/games/snake-ladder.js"></script>
    <script src="js/games/tap-trap.js"></script>
    <script src="script.js"></script>
</body>
</html>
