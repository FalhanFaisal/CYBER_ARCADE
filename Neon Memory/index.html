<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#15132b" />
  <title>Neon Memory — Match Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <div class="brand"><span class="brand-badge">🔮</span><h1>NEON <em>MEMORY</em></h1></div>
    </header>

    <section class="game-panel" aria-label="Memory match game">
      <div class="top-row">
        <div class="stat-card moves-card"><span>Moves</span><strong id="moves">0</strong><small id="pairsLeft">6 PAIRS LEFT</small></div>
        <div class="timer-wrap"><div class="timer-ring"><strong id="timer">0:00</strong><span>TIME</span></div></div>
        <div class="stat-card best-card"><span>Best</span><strong id="bestMoves">—</strong><small>FEWEST MOVES</small></div>
      </div>

      <div class="settings">
        <div class="difficulty" role="group" aria-label="Difficulty">
          <button class="level active" data-level="easy">Easy</button>
          <button class="level" data-level="medium">Medium</button>
          <button class="level" data-level="hard">Hard</button>
        </div>
      </div>

      <div class="board" id="board" aria-label="Card grid"></div>

      <button class="start-button" id="startButton"><span>🔀</span> New Game</button>
      <p class="hint">Flip two cards to find a match!</p>
    </section>
  </main>

  <div class="modal" id="gameOver" aria-hidden="true">
    <div class="modal-card">
      <div class="trophy">🏆</div>
      <p>SOLVED!</p>
      <h2 id="finalMoves">0</h2>
      <span>moves · <strong id="finalTime">0:00</strong></span>
      <div id="newBest" class="new-best">NEW BEST!</div>
      <button id="playAgain">Play Again <span>↻</span></button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
